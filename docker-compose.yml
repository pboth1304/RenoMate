version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: renomate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: renomate
      POSTGRES_PASSWORD: renomate
      POSTGRES_DB: renomate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renomate} -d ${POSTGRES_DB:-renomate}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
